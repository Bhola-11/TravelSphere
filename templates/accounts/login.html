{% extends 'base.html' %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5">
                <div class="text-center mb-4">
                    <h3 class="fw-bold">Welcome Back</h3>
                    <p class="text-muted small">Sign in to manage your bookings and itineraries</p>
                </div>
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Email or Phone</label>
                        {{ form.username }}
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-semibold">Password</label>
                        {{ form.password }}
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2 rounded-pill fw-bold mb-3 shadow-sm">Sign In</button>
                </form>
                <div class="text-center text-muted small">
                    Don't have an account? <a href="{% url 'accounts:register_customer' %}" class="text-primary fw-bold text-decoration-none">Sign Up</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
